# INTERIM TLS — dipakai selama port 80/443 milik nginx lain.
# Cara pakai:
#   docker compose -f docker-compose.yml -f docker-compose.edge.yml up -d postgres app backup caddy-edge
# PENTING: service bernama caddy-edge (BUKAN caddy) agar tidak merge dengan
# service caddy di docker-compose.yml (itu untuk masa depan saat 443 bebas).
# Alur: browser --HTTPS--> Cloudflare (orange cloud) --HTTPS(8880, cert internal)--> caddy-edge --HTTP--> app
# Syarat: record A proxied ON, SSL mode Full/Flexible (bukan Strict),
#         firewall VPS membuka TCP 8880.
services:
  caddy-edge:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "8880:8880"
    volumes:
      - ./Caddyfile.edge:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
