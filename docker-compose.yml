services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: tracker
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?isi POSTGRES_PASSWORD di .env}
      POSTGRES_DB: tracker
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tracker -d tracker"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      args:
        NEXT_PUBLIC_SITE_URL: ${APP_URL:?isi APP_URL di .env}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://tracker:${POSTGRES_PASSWORD}@postgres:5432/tracker
      AUTH_SECRET: ${AUTH_SECRET:?isi AUTH_SECRET di .env}
      NEXT_PUBLIC_SITE_URL: ${APP_URL}
    depends_on:
      postgres:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      PGHOST: postgres
      PGUSER: tracker
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: tracker
    volumes:
      - ./scripts/backup.sh:/scripts/backup.sh:ro
      - pgbackups:/backups
    depends_on:
      postgres:
        condition: service_healthy
    # Dump harian 02:00 + retensi 7 hari (lihat scripts/backup.sh)
    command: sh -c "echo '0 2 * * * /scripts/backup.sh' | crontab - && crond -f -d 8"

  # Tunnel Cloudflare (HTTPS tanpa butuh port 80/443).
  # Butuh TUNNEL_TOKEN di .env + Public Hostname tracking.langhap.dev
  # → http://app:3000 di dashboard Zero Trust.
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${TUNNEL_TOKEN:?isi TUNNEL_TOKEN di .env}
    depends_on:
      - app

volumes:
  pgdata:
  pgbackups:
  caddy_data:
  caddy_config:
