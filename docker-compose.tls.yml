# HTTPS valid di port 8443 (port 443 milik nginx lain — jangan pakai file ini
# bersamaan dengan ekspektasi 443). Cara pakai:
#   docker compose -f docker-compose.yml -f docker-compose.tls.yml -f docker-compose.http.yml up -d
# Renewal tiap ~60 hari: ulangi perintah lego run lalu restart caddy-tls.
services:
  caddy-tls:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "8443:8443"
    volumes:
      - ./Caddyfile.tls:/etc/caddy/Caddyfile:ro
      - le_certs:/certs:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  le_certs:
    external: true
